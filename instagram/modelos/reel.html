<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600&family=Martian+Mono:wght@400;500&display=swap">
<script src="ilustracoes.js"></script>
<style>
:root {
  --bg: #09080A; --ink: #F6F2F2; --muted: #B5ABAD; --red: #FF4747; --gold: #FFC14D; --dur: 18s;
  --display: "Sora", sans-serif; --body: "Hanken Grotesk", sans-serif; --mono: "Martian Mono", monospace;
}
* { box-sizing: border-box; margin: 0; }
html, body { width: 1080px; height: 1920px; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); overflow: hidden; position: relative; -webkit-font-smoothing: antialiased; }

.fundo { position: absolute; inset: 0; }
.brilho { position: absolute; border-radius: 50%; filter: blur(40px); }
.b1 { width: 1100px; height: 1100px; right: -420px; top: -360px; background: radial-gradient(circle, rgba(232,38,43,.40), transparent 62%); animation: deriva1 var(--dur) ease-in-out both; }
.b2 { width: 900px; height: 900px; left: -380px; bottom: 120px; background: radial-gradient(circle, rgba(232,38,43,.20), transparent 62%); animation: deriva2 var(--dur) ease-in-out both; }
@keyframes deriva1 { to { transform: translate(-140px, 180px); } }
@keyframes deriva2 { to { transform: translate(160px, -120px); } }
.grade { position: absolute; inset: 0;
  background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
  background-size: 72px 72px; -webkit-mask-image: radial-gradient(ellipse 90% 60% at 60% 22%, #000 10%, transparent 75%); animation: grade var(--dur) linear both; }
@keyframes grade { to { background-position: 0 144px, 144px 0; } }
.estrelas i { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #FFB4A8; box-shadow: 0 0 14px 3px rgba(255,90,84,.7); animation: pisca 3.2s ease-in-out infinite; }
@keyframes pisca { 0%, 100% { opacity: .15; transform: scale(.6); } 50% { opacity: .9; transform: scale(1); } }

.topo { position: absolute; left: 90px; right: 150px; top: 250px; display: grid; gap: 22px; }
.kicker { display: inline-flex; align-items: center; gap: 16px; font-family: var(--mono); font-size: 28px; letter-spacing: .16em; text-transform: uppercase; color: var(--red); }
.kicker::before { content: ""; width: 34px; height: 3px; background: currentColor; }
.barra { height: 6px; border-radius: 99px; background: rgba(255,255,255,.12); overflow: hidden; }
.barra span { display: block; height: 100%; transform-origin: left; background: linear-gradient(90deg, #E3262B, #FF8A7A); animation: progresso var(--dur) linear both; }
@keyframes progresso { from { transform: scaleX(0); } to { transform: scaleX(1); } }

.cena { position: absolute; left: 90px; right: 150px; top: 380px; bottom: 420px; display: flex; flex-direction: column; justify-content: center; gap: 46px; }
.a { animation-name: entra, sai; animation-duration: .7s, .45s; animation-timing-function: cubic-bezier(.2,.8,.2,1), ease-in;
  animation-fill-mode: both, forwards; animation-delay: var(--in), var(--out, 999s); }
.pop { animation-name: estoura, sai; animation-duration: .6s, .45s; animation-timing-function: ease-out, ease-in;
  animation-fill-mode: both, forwards; animation-delay: var(--in), var(--out, 999s); }
@keyframes entra { from { opacity: 0; transform: translateY(50px); filter: blur(10px); } to { opacity: 1; transform: none; filter: none; } }
@keyframes sai { to { opacity: 0; transform: translateY(-50px); filter: blur(8px); } }
@keyframes estoura { 0% { opacity: 0; transform: scale(.5); } 60% { opacity: 1; transform: scale(1.08); } 100% { opacity: 1; transform: scale(1); } }

h1 { font-family: var(--display); font-weight: 700; font-size: var(--h1, 120px); letter-spacing: -.045em; line-height: 1.04; text-wrap: balance; }
h1 > span { display: block; }
.titulo { font-family: var(--display); font-weight: 700; font-size: var(--t, 92px); letter-spacing: -.04em; line-height: 1.06; text-wrap: balance; }
.r { background: linear-gradient(92deg, #FF3B3B, #FF7468 55%, #FFB4A8); -webkit-background-clip: text; background-clip: text; color: transparent; }
.o { background: linear-gradient(92deg, #FFC14D, #FFE3A0 60%, #FFFFFF); -webkit-background-clip: text; background-clip: text; color: transparent; }
.media { font-size: 54px; line-height: 1.3; color: var(--muted); text-wrap: balance; }
.media b { color: var(--ink); font-weight: 600; }

.palco { position: relative; display: grid; place-items: center; }
.palco::before { content: ""; position: absolute; width: 760px; height: 460px; border-radius: 50%; background: radial-gradient(closest-side, rgba(232,38,43,.30), transparent); }
.ilu { position: relative; width: 820px; max-width: 100%; height: auto; stroke: #FF5A54; stroke-width: 5;
  filter: drop-shadow(0 0 16px rgba(255,71,71,.8)) drop-shadow(0 0 44px rgba(232,38,43,.5)); }
.desenha path, .desenha circle { stroke-dasharray: 1; stroke-dashoffset: 1; animation: traco 1.5s ease-in-out both; }
@keyframes traco { to { stroke-dashoffset: 0; } }

.checks { display: grid; gap: 30px; }
.check { display: flex; align-items: center; gap: 28px; font-size: 54px; font-weight: 600; }
.check i { flex: none; width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; border: 3px solid var(--red); background: rgba(232,38,43,.12); }
.check i::after { content: ""; width: 26px; height: 14px; border-left: 6px solid var(--red); border-bottom: 6px solid var(--red); transform: translateY(-4px) rotate(-45deg); }

/* Carta de crédito (vídeo 7) */
.palco3d { perspective: 1600px; }
.carta-entra { animation: carta-entra 1s cubic-bezier(.2,.8,.2,1) var(--in) both, sai .45s ease-in var(--out) forwards; }
@keyframes carta-entra { from { opacity: 0; transform: translateX(380px) rotateY(-40deg) rotateZ(6deg); } to { opacity: 1; transform: rotateY(-10deg) rotateX(6deg) rotateZ(-3deg); } }
.carta { position: relative; width: 760px; height: 480px; border-radius: 40px; padding: 46px; overflow: hidden; display: grid; grid-template-rows: auto 1fr auto; color: #fff;
  background: linear-gradient(145deg, #E8292E 0%, #A3141A 78%); border: 2px solid rgba(255,255,255,.25);
  box-shadow: 0 80px 160px -60px rgba(232,38,43,1), inset 0 2px 0 rgba(255,255,255,.25); animation: brilho-carta 1.4s ease-out var(--troca) both; }
@keyframes brilho-carta { 0% { box-shadow: 0 80px 160px -60px rgba(232,38,43,1); } 30% { box-shadow: 0 0 220px 30px rgba(255,193,77,.85); } 100% { box-shadow: 0 80px 160px -50px rgba(255,193,77,.9); } }
.carta::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(115deg, rgba(255,255,255,.05) 0 2px, transparent 2px 18px); }
.carta > * { position: relative; z-index: 1; }
.carta-topo { display: flex; justify-content: space-between; align-items: center; }
.carta-topo span { font-family: var(--mono); font-size: 26px; letter-spacing: .16em; text-transform: uppercase; color: rgba(255,255,255,.8); }
.chip { width: 96px; height: 70px; border-radius: 16px; background: linear-gradient(135deg, #FFE4A3, #FFC14D 50%, #B98522); position: relative; }
.carta-meio { display: grid; align-content: center; gap: 18px; }
.estados { position: relative; height: 66px; }
.estado { position: absolute; left: 0; top: 0; display: inline-flex; align-items: center; gap: 14px; font-family: var(--mono); font-size: 26px; letter-spacing: .14em; text-transform: uppercase; padding: 14px 26px; border-radius: 999px; }
.estado::before { content: ""; width: 14px; height: 14px; border-radius: 50%; background: currentColor; }
.e1 { color: #fff; border: 2px solid rgba(255,255,255,.5); background: rgba(255,255,255,.12); animation: some .3s ease-in var(--troca) forwards; }
.e2 { color: #241500; background: var(--gold); box-shadow: 0 0 50px rgba(255,193,77,.9); animation: estoura .6s ease-out var(--troca) both; }
@keyframes some { to { opacity: 0; transform: scale(.8); } }
.carta-nome { font-family: var(--display); font-weight: 700; font-size: 76px; letter-spacing: -.03em; }
.carta-base { display: flex; justify-content: space-between; font-size: 30px; font-weight: 600; }

/* Fechamento */
.fim { align-items: flex-start; gap: 36px; }
.avatar { width: 300px; height: 300px; border-radius: 50%; padding: 8px; background: conic-gradient(from 200deg, #FF4747, #FFC14D, #FF4747); box-shadow: 0 0 120px -20px rgba(232,38,43,.9); }
.avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; border: 6px solid var(--bg); }
.nome { font-family: var(--display); font-weight: 700; font-size: 104px; letter-spacing: -.04em; line-height: 1; }
.cargo { font-size: 44px; color: var(--muted); }
.cta { font-family: var(--display); font-weight: 600; font-size: 54px; color: #fff; padding: 30px 48px; border-radius: 999px; background: linear-gradient(135deg, #E8292E, #A3141A); box-shadow: 0 40px 90px -40px rgba(232,38,43,1); }
.onde { font-family: var(--mono); font-size: 36px; line-height: 1.7; color: var(--muted); }
.onde b { color: var(--ink); font-weight: 500; }
</style>
</head>
<body>
<div class="fundo"><div class="brilho b1"></div><div class="brilho b2"></div><div class="grade"></div><div class="estrelas" id="estrelas"></div></div>
<div class="topo"><span class="kicker">Seu sonho tem caminho</span><div class="barra"><span></span></div></div>
<div id="cenas"></div>

<script>
// ---------- peças ----------
const T = (classe, html, i, o, extra = "") => `<p class="${classe} a" style="--in:${i}s;${o ? `--out:${o}s;` : ""}${extra}">${html}</p>`;
const H1 = (linhas, i, o, tam) => `<h1 style="${tam ? `--h1:${tam}px` : ""}">${linhas.map((l, k) =>
  `<span class="a ${l.r ? "r" : ""}" style="--in:${(i + k * 0.45).toFixed(2)}s;--out:${(o + k * 0.05).toFixed(2)}s">${l.t}</span>`).join("")}</h1>`;
const DESENHO = (nome, i, o) => `<div class="palco a" style="--in:${i}s;--out:${o}s"><div class="desenha" data-in="${i}">${ilustracao(nome)}</div></div>`;
const CHECKS = (itens, i, o) => `<div class="checks">${itens.map((t, k) =>
  `<div class="check a" style="--in:${(i + k * 0.55).toFixed(2)}s;--out:${(o + k * 0.05).toFixed(2)}s"><i></i>${t}</div>`).join("")}</div>`;
const CARTA = (i, troca, o) => `<div class="palco3d"><div class="carta-entra" style="--in:${i}s;--out:${o}s"><div class="carta" style="--troca:${troca}s">
  <div class="carta-topo"><span>Carta de crédito</span><i class="chip"></i></div>
  <div class="carta-meio"><div class="estados"><span class="estado e1" style="--troca:${troca}s">Em andamento</span><span class="estado e2" style="--troca:${troca}s">Contemplada</span></div>
  <div class="carta-nome">Seu sonho</div></div>
  <div class="carta-base"><span>Ivan Fuly · Consórcios</span><span>Cota ••••</span></div></div></div></div>`;
const FIM = (t, cta = "Me conta o seu sonho →") => `
  <div class="avatar pop" style="--in:${t}s"><img src="avatar.jpg" alt=""></div>
  <div><p class="nome a" style="--in:${t + 0.3}s">Ivan Fuly</p><p class="cargo a" style="--in:${t + 0.5}s">Consultor de consórcios · Ademicon</p></div>
  <div class="cta pop" style="--in:${t + 0.9}s">${cta}</div>
  <p class="onde a" style="--in:${t + 1.3}s"><b>@ivan_fuly</b> · link na bio<br>ivanfulyconsorcios.com.br</p>`;
const r = (t) => ({ t, r: true }), n = (t) => ({ t });

// ---------- os 7 vídeos (18 s cada) ----------
const VIDEOS = {
  1: [ // A chave da sua casa
    H1([n("Todo mês,"), r("o aluguel"), r("vai embora.")], 0.3, 3.3, 130),
    DESENHO("casa", 3.7, 7.3) + T("media", "E se esse dinheiro", 4.6, 7.35) + T("titulo", 'virasse a <span class="r">sua casa?</span>', 5.0, 7.4),
    DESENHO("chave", 7.8, 11.2) + T("titulo", 'Imagina a chave <span class="r">na sua mão.</span>', 8.8, 11.25),
    T("titulo", "Com consórcio:", 11.6, 14.2) + CHECKS(["Sem juros", "Parcela que cabe no mês", "Sem entrada obrigatória"], 12.0, 14.25),
    FIM(14.6),
  ],
  2: [ // Carro novo
    H1([n("Fecha os olhos"), r("e imagina…")], 0.3, 3.3, 124),
    DESENHO("carro", 3.7, 7.3) + T("titulo", 'Você pegando a chave do <span class="r">seu carro novo.</span>', 4.8, 7.35),
    T("media", "Cheiro de carro novo, a família no banco de trás", 7.8, 11.2) + T("titulo", '<span class="r">e a estrada pela frente.</span>', 8.6, 11.25, "--t:110px"),
    T("titulo", "Esse sonho tem caminho:", 11.6, 14.2) + CHECKS(["Parcela sem juros", "Você compra à vista", "Plano do seu jeito"], 12.0, 14.25),
    FIM(14.6),
  ],
  3: [ // Moto
    H1([n("Sabe aquela moto"), r("que não sai da"), r("sua cabeça?")], 0.3, 3.3, 116),
    DESENHO("moto", 3.7, 7.3) + T("titulo", 'Ela pode <span class="r">ser sua.</span>', 4.8, 7.35, "--t:120px"),
    T("titulo", 'Com consórcio, você compra <span class="r">à vista.</span>', 7.8, 11.2, "--t:104px") + T("media", "E pagando à vista, <b>você negocia desconto.</b>", 8.7, 11.25),
    T("titulo", "Sem complicação:", 11.6, 14.2) + CHECKS(["Sem juros", "Sem entrada obrigatória", "Sorteio ou lance todo mês"], 12.0, 14.25),
    FIM(14.6),
  ],
  4: [ // Qual é o seu sonho?
    H1([n("Qual é o"), r("seu sonho?")], 0.3, 3.3, 140),
    DESENHO("casa", 3.6, 6.1) + T("titulo", 'A <span class="r">casa própria?</span>', 4.3, 6.15, "--t:110px"),
    DESENHO("carro", 6.4, 8.9) + T("titulo", 'O <span class="r">carro novo?</span>', 7.1, 8.95, "--t:110px"),
    DESENHO("moto", 9.2, 11.7) + T("titulo", 'A <span class="r">moto dos sonhos?</span>', 9.9, 11.75, "--t:110px"),
    H1([n("Todo sonho"), r("tem um caminho.")], 12.0, 14.2, 124),
    FIM(14.6, "Comenta o seu sonho ↓"),
  ],
  5: [ // Aluguel
    H1([n("Quanto você já"), r("pagou de aluguel?")], 0.3, 3.3, 124),
    T("media", "Todo mês o dinheiro vai embora…", 3.7, 7.2) + T("titulo", 'e a casa <span class="r">continua sendo de outra pessoa.</span>', 4.5, 7.25),
    DESENHO("casa", 7.6, 11.2) + T("titulo", 'E se a parcela te levasse <span class="r">até a sua casa?</span>', 8.6, 11.25, "--t:84px"),
    T("titulo", "No consórcio:", 11.6, 14.2) + CHECKS(["Sem juros", "Pode usar o FGTS", "Parcela que cabe no mês"], 12.0, 14.25),
    FIM(14.6),
  ],
  6: [ // Sem juros
    H1([n("Seu sonho"), r("sem juros.")], 0.3, 3.3, 150),
    T("media", "No financiamento,", 3.7, 7.2) + T("titulo", 'os juros fazem você <span class="r">pagar bem mais.</span>', 4.3, 7.25, "--t:104px"),
    T("media", "No consórcio,", 7.6, 11.2) + T("titulo", 'tem taxa de administração <span class="r">e zero juros.</span>', 8.2, 11.25, "--t:100px"),
    T("titulo", 'Custo total <span class="r">geralmente menor.</span>', 11.6, 14.2, "--t:110px") + T("media", "<b>Mais perto do seu sonho.</b>", 12.5, 14.25),
    FIM(14.6),
  ],
  7: [ // Sonho realizado
    H1([n("Sabe qual é o"), r("dia mais feliz"), n("do consórcio?")], 0.3, 3.3, 116),
    T("media", "O dia da <b>contemplação.</b>", 3.7, 7.2) + CARTA(4.0, 5.5, 7.25),
    DESENHO("chave", 7.6, 11.2) + T("titulo", 'A carta vira a <span class="r">chave do seu sonho.</span>', 8.6, 11.25),
    T("titulo", 'Eu quero te ajudar <span class="r">a chegar nesse dia.</span>', 11.6, 14.2) + T("media", "Sem promessa de data. <b>Com planejamento de verdade.</b>", 12.5, 14.25),
    FIM(14.6),
  ],
};

const n_video = Number(location.hash.slice(1) || 1);
document.getElementById("cenas").innerHTML = VIDEOS[n_video].map((html, k, todas) =>
  `<section class="cena ${k === todas.length - 1 ? "fim" : ""}">${html}</section>`).join("");
// traço que se desenha, peça por peça
document.querySelectorAll(".desenha").forEach((d) => {
  const ini = Number(d.dataset.in);
  d.querySelectorAll("path, circle").forEach((el, k) => {
    el.setAttribute("pathLength", "1");
    el.style.animationDelay = `${(ini + 0.15 + k * 0.09).toFixed(2)}s`;
  });
});
// brilhos de fundo
const est = document.getElementById("estrelas");
for (let k = 0; k < 26; k++) {
  const i = document.createElement("i");
  i.style.left = `${(k * 37 + 11) % 100}%`;
  i.style.top = `${(k * 53 + 7) % 100}%`;
  i.style.animationDelay = `${-(k * 0.41) % 3.2}s`;
  est.appendChild(i);
}
window.irPara = (ms) => { for (const a of document.getAnimations()) { a.pause(); a.currentTime = ms; } };
</script>
</body>
</html>
